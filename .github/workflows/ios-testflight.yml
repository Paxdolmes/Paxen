# Builds the Paxen iPhone app (web/ios, Capacitor) on a cloud Mac and uploads it to TestFlight.
# Run it from GitHub: Actions > "iPhone app to TestFlight" > Run workflow. Setup: docs/iphone-app.md.
name: iPhone app to TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Build the app's screens (same code as the web app)
        run: |
          pnpm build
        env:
          MOBILE_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          # the live API (not secret: the web app uses the same address); a PAXEN_API_URL repository variable overrides it
          NEXT_PUBLIC_PAXEN_API_URL: ${{ vars.PAXEN_API_URL || 'https://paxen-production.up.railway.app' }}
      - run: npx cap sync ios

      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Restore the signing certificate (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/signing-cache
          key: paxen-signing-${{ github.run_id }}
          restore-keys: paxen-signing-

      - name: Signing (distribution certificate + App Store profile)
        working-directory: .
        env:
          SIGNING_CACHE: ${{ runner.temp }}/signing-cache
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUNDLE_ID: com.paxdolmes.paxen
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "cryptography>=42"
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/ios_signing.py setup

      - name: Build and sign
        working-directory: web/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Paxen.xcarchive" archive \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        working-directory: web/ios/App
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Paxen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep the signing certificate for next time (encrypted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/signing-cache
          key: paxen-signing-${{ github.run_id }}

      - name: Remove the temporary keychain
        if: always()
        working-directory: .
        run: |
          test -x "$RUNNER_TEMP/venv/bin/python" && "$RUNNER_TEMP/venv/bin/python" .github/scripts/ios_signing.py cleanup || true

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
