# Builds the Paxen iPhone app (mobile/, React Native with Expo) on a cloud Mac and uploads it to TestFlight.
# Run by hand (Actions > "iPhone app to TestFlight" > Run workflow): a Mac build costs about £1 of Actions minutes.
# Signing is done through the App Store Connect API (.github/scripts/ios_signing.py). Setup: docs/iphone-app.md.
name: iPhone app to TestFlight

on:
  workflow_dispatch:

concurrency: testflight

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # the live API (not secret: the web app uses the same address); a PAXEN_API_URL repository variable overrides it
      EXPO_PUBLIC_PAXEN_API_URL: ${{ vars.PAXEN_API_URL || 'https://paxen-production.up.railway.app' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check-shared && npm run typecheck && npx eslint . && npm test

      - name: Generate the iOS project (expo prebuild, CocoaPods)
        run: npx expo prebuild --platform ios --clean --no-install && cd ios && pod install

      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Restore the signing certificate (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/signing-cache
          key: paxen-signing-${{ github.run_id }}
          restore-keys: paxen-signing-

      - name: Signing (distribution certificate + App Store profile)
        working-directory: .
        env:
          SIGNING_CACHE: ${{ runner.temp }}/signing-cache
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUNDLE_ID: com.paxdolmes.paxen
          PBXPROJ: mobile/ios/Paxen.xcodeproj/project.pbxproj
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "cryptography>=42"
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/ios_signing.py setup

      - name: Build and sign
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Paxen.xcworkspace -scheme Paxen -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Paxen.xcarchive" archive | tail -n 200

      - name: Upload to TestFlight
        working-directory: mobile/ios
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Paxen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep the signing certificate for next time (encrypted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/signing-cache
          key: paxen-signing-${{ github.run_id }}

      - name: Remove the temporary keychain
        if: always()
        working-directory: .
        run: |
          test -x "$RUNNER_TEMP/venv/bin/python" && "$RUNNER_TEMP/venv/bin/python" .github/scripts/ios_signing.py cleanup || true

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
