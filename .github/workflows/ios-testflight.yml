# Builds the Paxen iPhone app (mobile/, React Native with Expo) on a cloud Mac and uploads it to TestFlight.
# Run by hand (Actions > "iPhone app to TestFlight" > Run workflow): a Mac build costs about £1 of Actions minutes.
# Signing is done through the App Store Connect API (.github/scripts/ios_signing.py). Setup: docs/iphone-app.md.
name: iPhone app to TestFlight

on:
  workflow_dispatch:
    inputs:
      widgets:
        description: "Include the home-screen widget and lock-screen trip (needs the App Group: docs/iphone-app.md)"
        type: boolean
        default: false
      runner:
        description: "Mac to build on (macos-15-intel if GitHub is short of Apple-silicon Macs: queued, then cancelled)"
        type: choice
        options: [macos-latest, macos-26, macos-15, macos-15-intel]
        default: macos-latest

concurrency: testflight

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 120  # an Intel Mac (macos-15-intel) takes much longer than an Apple-silicon one
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # the live API (not secret: the web app uses the same address); a PAXEN_API_URL repository variable overrides it
      EXPO_PUBLIC_PAXEN_API_URL: ${{ vars.PAXEN_API_URL || 'https://paxen-production.up.railway.app' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: "1"
      # the widget extension is only generated (expo prebuild) and signed when asked for
      PAXEN_WIDGETS: ${{ inputs.widgets && '1' || '0' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # The newest Xcode release installed on the runner, whatever its default: App Store Connect only takes builds
      # made with Xcode 26 or later, and Expo's Swift code needs a recent compiler (build 25 failed on the Intel Mac's
      # default Xcode 26.3: "sending 'slot' risks causing data races" in expo-modules-jsi)
      - name: Xcode
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i -e beta -e release_candidate -e _rc | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - run: npm ci
      # one capture in Expo's Swift code that Xcode 26.3 rejects (the Intel Mac's newest): see the script
      - run: node scripts/patch-expo-modules-jsi.mjs
      - run: npm run check-shared && npm run typecheck && npx eslint . && npm test

      - name: Generate the iOS project (expo prebuild, CocoaPods)
        run: npx expo prebuild --platform ios --clean --no-install && cd ios && pod install

      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # The encrypted certificate is cached at a workspace-relative path, so the daily "TestFlight testers" job (Linux)
      # can open it too: GitHub deletes caches unused for 7 days, and losing it would mean a new Apple certificate.
      - name: Restore the signing certificate (encrypted)
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: .signing-cache
          key: paxen-signing-v2-${{ github.run_id }}
          restore-keys: paxen-signing-v2-
      - name: Restore it from the cache's old location (until the new one exists)
        if: steps.signing-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/signing-cache
          key: paxen-signing-${{ github.run_id }}
          restore-keys: paxen-signing-
      - if: steps.signing-cache.outputs.cache-matched-key == ''
        working-directory: .
        run: if [ -f "$RUNNER_TEMP/signing-cache/dist.p12" ]; then cp -R "$RUNNER_TEMP/signing-cache" .signing-cache; fi

      - name: Signing (distribution certificate + App Store profile)
        working-directory: .
        env:
          SIGNING_CACHE: ${{ github.workspace }}/.signing-cache
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          BUNDLE_ID: com.paxdolmes.paxen
          WIDGET_BUNDLE_ID: ${{ inputs.widgets && 'com.paxdolmes.paxen.widgets' || '' }}
          APP_GROUP_ID: group.com.paxdolmes.paxen
          PBXPROJ: mobile/ios/Paxen.xcodeproj/project.pbxproj
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "cryptography>=42"
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/ios_signing.py setup

      - name: Build and sign
        working-directory: mobile/ios
        # The full output is tens of thousands of lines: it goes to a file, and only the end is shown, or, when the
        # build fails, every error line and what came just before the first one (a build script's own output
        # isn't in the last lines, which is how build 24's failure went unexplained)
        run: |
          log="$RUNNER_TEMP/xcodebuild.log"
          if xcodebuild -workspace Paxen.xcworkspace -scheme Paxen -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Paxen.xcarchive" archive > "$log" 2>&1; then
            tail -n 40 "$log"
            exit 0
          fi
          echo "::group::Every error line"
          grep -n -E "error:|fatal error|Command .* failed|\*\* .* FAILED \*\*" "$log" | cut -c1-400 | head -n 100
          echo "::endgroup::"
          first=$(grep -n -m1 -E "error:" "$log" | cut -d: -f1 || true)
          if [ -n "$first" ]; then
            echo "::group::The 60 lines before the first error, and 20 after"
            sed -n "$(( first > 60 ? first - 60 : 1 )),$(( first + 20 ))p" "$log" | cut -c1-600
            echo "::endgroup::"
          fi
          tail -n 60 "$log" | cut -c1-600
          exit 1

      - name: Upload to TestFlight
        working-directory: mobile/ios
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Paxen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep the signing certificate for next time (encrypted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .signing-cache
          key: paxen-signing-v2-${{ github.run_id }}

      - name: Remove the temporary keychain
        if: always()
        working-directory: .
        run: |
          test -x "$RUNNER_TEMP/venv/bin/python" && "$RUNNER_TEMP/venv/bin/python" .github/scripts/ios_signing.py cleanup || true

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
