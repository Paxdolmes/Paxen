# Builds the iPhone app exactly as for TestFlight (Release, the same JavaScript bundle) but for the iOS Simulator, opens
# it, watches it for a minute and prints whether it's still running, the app's console, any crash report and its
# log, with a screenshot as an artifact. For finding a crash on launch without a phone. No signing, no upload.
name: iPhone app in the simulator
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac to build on (macos-15-intel while GitHub is short of Apple-silicon Macs)"
        type: choice
        options: [macos-15-intel, macos-latest, macos-26, macos-15]
        default: macos-15-intel
concurrency: simulator
jobs:
  simulator:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_PAXEN_API_URL: ${{ vars.PAXEN_API_URL || 'https://paxen-production.up.railway.app' }}
      EXPO_NO_TELEMETRY: "1"
      PAXEN_WIDGETS: "0"
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Xcode
        run: |
          sw_vers
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i -e beta -e release_candidate -e _rc | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - run: npm ci
      - run: node scripts/patch-expo-modules-jsi.mjs
      - name: Generate the iOS project (expo prebuild, CocoaPods)
        run: npx expo prebuild --platform ios --clean --no-install && cd ios && pod install
      - name: Build for the simulator (Release, as TestFlight)
        working-directory: mobile/ios
        run: |
          log="$RUNNER_TEMP/xcodebuild.log"
          arch=$(uname -m)
          if xcodebuild -workspace Paxen.xcworkspace -scheme Paxen -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS="$arch" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build > "$log" 2>&1; then
            tail -n 10 "$log"
            exit 0
          fi
          grep -n -E "error:|fatal error|\*\* .* FAILED \*\*" "$log" | cut -c1-400 | head -n 80
          tail -n 60 "$log" | cut -c1-600
          exit 1
      - name: Open the app with a set-up account, twice, and watch it
        run: |
          set +e
          out="$RUNNER_TEMP/sim"; mkdir -p "$out"
          api="$EXPO_PUBLIC_PAXEN_API_URL"
          app=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          echo "app: $app ($bundle)"
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for runtime in sorted(d, reverse=True):
              if "iOS" in runtime:
                  phones = [x for x in d[runtime] if x["name"].startswith("iPhone")]
                  if phones:
                      print(phones[0]["udid"]); break')
          echo "simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl privacy "$udid" grant location-always "$bundle"
          xcrun simctl privacy "$udid" grant notifications "$bundle" 2>/dev/null
          # A temporary production account set up like a real one (Home, Work, commutes), deleted at the end, so
          # the app opens on Today with real data, as on a phone
          tok=$(curl -s -X POST "$api/v1/users" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$tok"
          echo "$tok" > "$RUNNER_TEMP/token"
          curl -s -o /dev/null -w "onboarding: %{http_code}\n" -X POST "$api/v1/onboarding" -H "Authorization: Bearer $tok" \
            -H "Content-Type: application/json" -d '{"home":{"label":"home","name":"Orford Road","lat":51.5826,"lon":-0.0128},"work":{"label":"work","name":"Regent Street","lat":51.5141,"lon":-0.1405}}'
          curl -s -o /dev/null -w "dashboard: %{http_code}\n" "$api/v1/dashboard" -H "Authorization: Bearer $tok"
          container=$(xcrun simctl get_app_container "$udid" "$bundle" data)
          store="$container/Library/Application Support/$bundle/RCTAsyncLocalStorage_V1"
          mkdir -p "$store"
          printf '{"paxen.token":"%s"}' "$tok" > "$store/manifest.json"
          running() { xcrun simctl spawn "$udid" launchctl list | grep -q "UIKitApplication:$bundle"; }
          for n in 1 2; do
            xcrun simctl launch --console-pty "$udid" "$bundle" > "$out/console-$n.log" 2>&1 &
            sleep 70
            xcrun simctl io "$udid" screenshot "$out/screen-$n.png"
            if running; then echo "RESULT launch $n: still running after 70 seconds"; else echo "RESULT launch $n: NOT running after 70 seconds (crashed or quit)"; fi
            echo "::group::Launch $n: app console (last 150 lines)"
            tail -n 150 "$out/console-$n.log" | cut -c1-600
            echo "::endgroup::"
            grep -n -i -E "terminating app|uncaught exception|reason:|exception '|was thrown while invoking|fatal" "$out/console-$n.log" | head -20
            xcrun simctl terminate "$udid" "$bundle" 2>/dev/null
            sleep 3
          done
          ls -la "$store" > "$out/storage.txt" 2>&1
          echo "::group::Crash reports"
          for f in ~/Library/Logs/DiagnosticReports/*; do
            case "$f" in *Paxen*|*paxen*) echo "== $f"; cp "$f" "$out/"; head -c 40000 "$f"; echo;; esac
          done
          echo "::endgroup::"
          echo "::group::System log for the app (last 6 minutes)"
          xcrun simctl spawn "$udid" log show --last 6m --style compact --predicate 'process == "Paxen"' 2>/dev/null \
            | grep -v -E "^Timestamp|libnetwork|nw_" | tail -n 400 | cut -c1-500
          echo "::endgroup::"
          exit 0
      - name: Delete the temporary account
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/token" ]; then
            curl -s -o /dev/null -w "deleted: %{http_code}\n" -X DELETE "$EXPO_PUBLIC_PAXEN_API_URL/v1/me" \
              -H "Authorization: Bearer $(cat "$RUNNER_TEMP/token")"
            rm -f "$RUNNER_TEMP/token"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-run
          path: ${{ runner.temp }}/sim
          if-no-files-found: ignore
