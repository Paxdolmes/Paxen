# When GitHub is short of Macs, an iPhone build or simulator check can wait in the queue and then end without ever
# starting ("The job was not acquired by Runner of type hosted"; the run then shows as cancelled or failed). Every half
# hour this checks the latest "iPhone app to TestFlight" and "iPhone app in the simulator" runs and, only if no Mac
# ever picked the latest one up, starts it again on the next kind of Mac in turn. It never repeats a run that started
# (passed or failed), or one older than 12 hours, and gives up after 12 tries in a row.
name: iPhone build, try again if no Mac was free
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const runners = ['macos-15-intel', 'macos-latest', 'macos-15', 'macos-26']
            // No job of the run ever got a Mac: no runner, no step started.
            const neverStarted = async (run) => {
              if (run.status !== 'completed' || run.conclusion === 'success') return false
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id })).data.jobs
              return jobs.length > 0 && jobs.every((j) => !j.runner_name && !(j.steps || []).length)
            }
            for (const [workflow_id, what] of [['ios-testflight.yml', 'Build'], ['ios-simulator.yml', 'Simulator check']]) {
              const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, per_page: 20 })).data.workflow_runs
              const latest = runs[0]
              if (!latest) { core.info(`${what}: none yet.`); continue }
              const name = `${what} ${latest.run_number}`
              if (latest.status !== 'completed') { core.info(`${name} is ${latest.status}: nothing to do.`); continue }
              if (!(await neverStarted(latest))) { core.info(`${name} ran (${latest.conclusion}): nothing to do.`); continue }
              if (Date.now() - new Date(latest.created_at).getTime() > 12 * 3600e3) { core.info(`${name}: too old to retry.`); continue }
              let tries = 0
              for (const r of runs) {
                if (r.head_sha !== latest.head_sha || !(await neverStarted(r))) break
                tries++
              }
              if (tries >= 12) { core.warning(`${what}: gave up, ${tries} runs in a row found no Mac.`); continue }
              const runner = runners[tries % runners.length]
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: latest.head_branch, inputs: { runner }, // (widgets: its default, off)
              })
              core.notice(`${name} never got a Mac (${tries} in a row): started again on ${runner}.`)
            }
